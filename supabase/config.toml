project_id = "shapeos-fichafacil"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false


# Passkeys/WebAuthn for local development and CI.
# Production must use the same feature in the hosted Supabase Auth settings.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "ShapeOS"
rp_id = "localhost"
rp_origins = ["http://localhost:3000"]
