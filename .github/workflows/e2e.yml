name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated Supabase
        run: pnpm exec supabase start

      - name: Export local Supabase credentials
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          ANON_VALUE="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE_VALUE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          test -n "$API_URL"
          test -n "$ANON_VALUE"
          test -n "$SERVICE_VALUE"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_VALUE"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_VALUE"
          } >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Shared package tests
        run: pnpm test:shared

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e -- --reporter=list

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
