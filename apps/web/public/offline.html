<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · ShapeOS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .icone {
        font-size: 48px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #64748b;
        font-size: 15px;
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icone">📶</div>
      <h1>Você está offline</h1>
      <p>
        Sem conexão com a internet. As páginas que você já visitou continuam
        disponíveis no menu do navegador ou instalando o app.
      </p>
    </main>
  </body>
</html>
