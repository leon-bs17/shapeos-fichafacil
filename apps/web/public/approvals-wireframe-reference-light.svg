<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 226" fill="none" preserveAspectRatio="xMaxYMid meet" shape-rendering="geometricPrecision">
  <title>Wireframe circular de aprovações para o modo claro</title>
  <defs>
    <linearGradient id="mesh-color" x1="65" y1="0" x2="480" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d8478" stop-opacity=".20"/>
      <stop offset=".42" stop-color="#238575" stop-opacity=".36"/>
      <stop offset="1" stop-color="#2b8875" stop-opacity=".20"/>
    </linearGradient>
    <linearGradient id="mesh-fade" x1="0" y1="0" x2="635" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".25"/>
      <stop offset=".18" stop-color="white" stop-opacity=".8"/>
      <stop offset=".46" stop-color="white"/>
      <stop offset=".58" stop-color="white" stop-opacity=".75"/>
      <stop offset=".76" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="mesh-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="635" height="226">
      <rect width="635" height="226" fill="url(#mesh-fade)"/>
    </mask>
  </defs>
  <!-- A abertura circular fica acima do centro; o banner recorta o topo e a base. -->
  <g stroke="url(#mesh-color)" stroke-width="1.05" mask="url(#mesh-mask)">
